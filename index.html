
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📊 POS Financial Tracker</h1>

        <div class="pos-grid">
            <section class="tracker-section" id="accounts-section">
                <h2>🏦 Manage Accounts</h2>
                <div class="input-form">
                    <input type="text" id="account-name" placeholder="New Account Name">
                    <input type="number" id="initial-balance" placeholder="Initial Balance">
                    <button id="create-account-btn">Create Account</button>
                </div>
                <div id="accounts-list"></div>
            </section>

            <section class="tracker-section" id="expense-tracker">
                <h2>💰 Add Expense</h2>
                <div class="input-form">
                    <select id="expense-account" aria-label="Select Account for Expense"></select>
                    <input type="text" id="expense-desc" placeholder="Expense Description">
                    <input type="number" id="expense-amount" placeholder="Amount">
                    <button id="add-expense-btn">Add Expense</button>
                </div>
                <h3>Expense History</h3>
                <ul id="expense-list" class="history-list">
                </ul>
                <div class="summary">
                    <p>Today's Total: <span id="daily-total">0.00</span></p>
                </div>
            </section>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
